name: Build openfoam13_for_pato linux-64

on:
  workflow_dispatch:  # triggered manually from GitHub Actions UI

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staged-recipes
        uses: actions/checkout@v4
        with:
          repository: pato-devel/staged-recipes
          ref: openfoam13_for_pato
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install git-lfs
        run: |
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Checkout source with LFS
        uses: actions/checkout@v4
        with:
          repository: pato-devel/openfoam13_for_pato_conda
          ref: 13_20250911
          path: openfoam13_for_pato_conda
          lfs: true
          token: ${{ secrets.PAT_TOKEN }}

      - name: Build in CentOS 7 container
        run: |
          mkdir -p ${{ github.workspace }}/conda-bld
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ github.workspace }}/conda-bld:/opt/conda/conda-bld \
            -w /workspace \
            condaforge/linux-anvil-cos7-x86_64 \
            bash -c "
              set -e
              conda config --set solver classic
              CONDA_NO_PLUGINS=true conda install conda-build -c conda-forge --override-channels -y
              cp -r /workspace/recipes/openfoam13_for_pato /tmp/openfoam13_recipe
              sed -i 's|git_url:.*||' /tmp/openfoam13_recipe/meta.yaml
              sed -i 's|git_rev:.*|path: /workspace/openfoam13_for_pato_conda|' /tmp/openfoam13_recipe/meta.yaml
              conda build /tmp/openfoam13_recipe --no-test -c conda-forge --override-channels
            "

      - name: Generate repodata and upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          pip install conda-index awscli
          mkdir -p conda-channel/linux-64
          cp ${{ github.workspace }}/conda-bld/linux-64/openfoam13_for_pato-*.conda conda-channel/linux-64/
          conda-index conda-channel
          aws s3 sync conda-channel/linux-64 s3://pato-conda-channel/linux-64 \
            --endpoint-url $R2_ENDPOINT
