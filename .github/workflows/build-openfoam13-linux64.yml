name: Build openfoam13_for_pato linux-64

on:
  workflow_dispatch:  # triggered manually from GitHub Actions UI

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout staged-recipes
        uses: actions/checkout@v4
        with:
          repository: pato-devel/staged-recipes
          ref: openfoam13_for_pato
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install git-lfs
        run: |
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Checkout source with LFS
        uses: actions/checkout@v4
        with:
          repository: pato-devel/openfoam13_for_pato_conda
          ref: 13_20250911
          path: openfoam13_for_pato_conda
          lfs: true
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict

      - name: Install conda-build
        shell: bash -l {0}
        run: |
          conda install conda-build -c conda-forge --override-channels -y

      - name: Patch OpenFOAM source for Linux
        run: |
          echo "--- top-level source structure ---"
          ls "$GITHUB_WORKSPACE/openfoam13_for_pato_conda/"
          INT_H=$(find "$GITHUB_WORKSPACE/openfoam13_for_pato_conda" -name "int.H" -path "*/ints/int/int.H" | head -1)
          if [ -z "$INT_H" ]; then
            echo "ERROR: int.H not found, showing 3-level tree:"
            find "$GITHUB_WORKSPACE/openfoam13_for_pato_conda" -maxdepth 3 -type d
            exit 1
          fi
          echo "Patching: $INT_H"
          sed -i 's/MAXMIN(string::size_type,string::size_type,string::size_type)/#ifdef __APPLE__\nMAXMIN(string::size_type,string::size_type,string::size_type)\n#endif/' "$INT_H"
          echo "Patched int.H"
          grep -A2 -B1 "__APPLE__" "$INT_H"

      - name: Set source path in meta.yaml
        run: |
          cp -r recipes/openfoam13_for_pato /tmp/openfoam13_recipe
          python3 -c 'import re,os; m=open("/tmp/openfoam13_recipe/meta.yaml").read(); m=re.sub(r"^\s+url:.*\n","",m,flags=re.M); m=re.sub(r"^\s+sha256:.*\n","  path: "+os.environ["GITHUB_WORKSPACE"]+"/openfoam13_for_pato_conda\n",m,flags=re.M); open("/tmp/openfoam13_recipe/meta.yaml","w").write(m)'
          echo "--- meta.yaml after patch ---"
          cat /tmp/openfoam13_recipe/meta.yaml

      - name: Build
        shell: bash -l {0}
        run: |
          conda-build /tmp/openfoam13_recipe --no-test -c conda-forge --override-channels

      - name: Generate repodata and upload to R2
        shell: bash -l {0}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p conda-channel/linux-64
          cp $(conda info --base)/conda-bld/linux-64/openfoam13_for_pato-*.conda conda-channel/linux-64/
          conda index conda-channel
          pip install awscli
          aws s3 sync conda-channel/linux-64 s3://pato-conda-channel/linux-64 \
            --endpoint-url $R2_ENDPOINT
